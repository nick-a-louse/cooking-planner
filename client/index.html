<html lang="en-GB">

    <meta charset="UTF-8" />

    <title>Cooking Planner</title>
    <!-- icons: all generated from static/icon.svg, the same file as the header logo -->
    <link rel="icon" href="/static/icon.svg?v=%VITE_APP_VERSION%" type="image/svg+xml" />
    <link rel="icon" href="/static/favicon-32.png?v=%VITE_APP_VERSION%" sizes="32x32" type="image/png" />
    <link rel="icon" href="/static/favicon.ico?v=%VITE_APP_VERSION%" sizes="any" />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=%VITE_APP_VERSION%" />
    <link rel="manifest" href="/static/manifest.webmanifest?v=%VITE_APP_VERSION%" />
    <meta name="theme-color" content="#7b3a72" />
    <!-- theme boot + shared styles, before first paint (gomez-ui) -->
    <meta name="color-scheme" content="light dark" />

    <link rel="stylesheet" href="/static/gomez-ui.css?v=%VITE_APP_VERSION%" />
    <script src="/static/gomez-ui.js?v=%VITE_APP_VERSION%" defer></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
