# What runs on gomez, in /srv/cooking-planner (alongside .env). The image is built by GitHub Actions.
services:
  cooking-planner:
    image: ghcr.io/nick-a-louse/cooking-planner:latest
    container_name: cooking-planner
    restart: unless-stopped
    user: "${PUID:-1003}:${PGID:-1006}"   # PUID/PGID live in .env, like the linuxserver containers
    env_file: .env
    ports:
      - "3005:8000"          # registered in Obsidian: App standard → Port register
    volumes:
      - /opt/appdata/cooking-planner:/data   # SQLite: app.db + app.db-wal + app.db-shm
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
