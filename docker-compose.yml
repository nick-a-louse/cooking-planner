services:
  cooking-planner:
    build: .
    image: cooking-planner:latest
    container_name: cooking-planner
    ports:
      - "${HOST_PORT:-3005}:3001"
    volumes:
      # Host path for the SQLite DB. Set DATA_DIR in .env (the home server uses
      # /opt/appdata/cooking-planner); defaults to ./data for local runs.
      - ${DATA_DIR:-./data}:/data
    restart: unless-stopped
